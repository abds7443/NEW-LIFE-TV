name: Build NEW LIFE TV APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk NewLifeTV-1.0.${{ github.run_number }}.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NewLifeTV-apk
          path: NewLifeTV-*.apk
      - name: Publish release here
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: NEW LIFE TV 1.0.${{ github.run_number }}
          body: Build ${{ github.run_number }} — ${{ github.event.head_commit.message }}
          files: NewLifeTV-1.0.${{ github.run_number }}.apk
          make_latest: true
      - name: Publish update for the app
        uses: softprops/action-gh-release@v2
        with:
          repository: abds7443/NEW-LIFE-TV-Updates
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: v${{ github.run_number }}
          name: NEW LIFE TV 1.0.${{ github.run_number }}
          body: Build ${{ github.run_number }}
          files: NewLifeTV-1.0.${{ github.run_number }}.apk
          make_latest: true
